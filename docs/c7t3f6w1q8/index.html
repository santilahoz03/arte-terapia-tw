<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>前 7 天 7 個練習 — 啟動計畫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 210mm 297mm; margin: 0; }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#FFF8F4;--lav:#D9C9F7;--lavd:#B89FE0;--pink:#F3B8D2;--gold:#C9A84C;--title:#4E4036;--body:#6F6258;--body2:#8A7A70;--green:#5BAA7A;--ft:'Noto Serif TC',serif;--fb:'Noto Sans TC',sans-serif; }
body { font-family:var(--fb); color:var(--body); background:var(--bg); }
.page { width:210mm; min-height:297mm; position:relative; page-break-after:always; overflow:hidden; display:flex; flex-direction:column; }
.cover { background:linear-gradient(145deg,#5BAA7A 0%,#4E4036 60%,#C9A84C 100%); align-items:center; justify-content:center; text-align:center; padding:36mm 20mm; }
.cover-badge { display:inline-block; background:rgba(91,170,122,.25); border:1px solid #7dd4a8; color:#7dd4a8; font-size:9pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:5px 18px; border-radius:20px; margin-bottom:20px; }
.cover h1 { font-family:var(--ft); font-size:28pt; color:#fff; line-height:1.3; margin-bottom:12px; }
.cover p { font-size:11pt; color:rgba(255,255,255,.85); margin-bottom:24px; line-height:1.5; }
.cover-pill { display:inline-block; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35); color:#fff; padding:7px 20px; border-radius:24px; font-size:9pt; font-weight:600; margin:3px; }
.guide-page { background:#fff; padding:16mm 18mm; }
.guide-h2 { font-family:var(--ft); font-size:20pt; color:var(--title); margin-bottom:6mm; padding-bottom:4mm; border-bottom:2px solid var(--lav); }
.guide-p { font-size:10pt; color:var(--body); line-height:1.65; margin-bottom:3mm; }
.day-page { background:#fff; padding:14mm 18mm; }
.day-banner { background:linear-gradient(135deg,#5BAA7A,#3d8a60); border-radius:10px; padding:10px 16px; margin-bottom:5mm; display:flex; align-items:center; gap:14px; }
.day-circle { width:46px; height:46px; border:2px solid rgba(255,255,255,.5); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--ft); font-size:15pt; color:#fff; flex-shrink:0; }
.day-banner-text h2 { font-family:var(--ft); font-size:17pt; color:#fff; }
.day-banner-text p { font-size:9pt; color:rgba(255,255,255,.75); margin-top:2px; }
.day-why { background:#e8f5ed; border-left:3px solid var(--green); border-radius:0 8px 8px 0; padding:7px 12px; margin-bottom:4mm; font-size:9.5pt; color:var(--body); line-height:1.55; }
.day-exercise { margin-bottom:4mm; }
.day-exercise h3 { font-family:var(--ft); font-size:14pt; color:var(--title); margin-bottom:3mm; }
.day-materials { background:#f5f0e8; border-radius:8px; padding:6px 10px; margin-bottom:3mm; font-size:9pt; color:var(--body2); }
.day-materials span { font-weight:700; color:var(--gold); }
.day-steps { display:flex; flex-direction:column; gap:2.5mm; margin-bottom:4mm; }
.day-step { display:flex; gap:8px; align-items:flex-start; }
.day-step-n { width:20px; height:20px; background:var(--green); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8pt; font-weight:700; color:#fff; flex-shrink:0; margin-top:1px; }
.day-step p { font-size:9.5pt; color:var(--body); line-height:1.5; }
.day-space { flex:1; border:1.5px dashed #d9c9f7; border-radius:8px; min-height:50mm; }
.day-promise { margin-top:3mm; background:linear-gradient(135deg,#f5f0e8,#e8f5ed); border-radius:8px; padding:7px 12px; font-size:9pt; color:var(--body); line-height:1.5; font-style:italic; }
@media print { .no-print { display:none!important; } }
@media screen { body { background:#e0d8d0; padding:20px; } .page { margin:0 auto 20px; box-shadow:0 4px 20px rgba(0,0,0,.2); } .print-btn { position:fixed; bottom:24px; right:24px; background:#5BAA7A; color:#fff; border:none; border-radius:50px; padding:14px 28px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(91,170,122,.5); z-index:1000; } }
</style>
</head>
<body>
<button class="print-btn no-print" onclick="window.print()">🖨️ 列印 / 儲存 PDF</button>
<div class="page cover">
  <div class="cover-badge">🚀 加值方案 · OB</div>
  <h1>前 7 天<br>7 個練習<br>啟動計畫</h1>
  <p>你的藝術治療旅程的最強起點</p>
  <div>
    <span class="cover-pill">📅 7 天計畫</span>
    <span class="cover-pill">🎯 每天一個練習</span>
    <span class="cover-pill">🚀 立刻啟動</span>
  </div>
</div>
<div class="page guide-page">
  <div class="guide-h2">為什麼前 7 天最關鍵</div>
  <p class="guide-p">研究表明，建立一個新習慣最關鍵的時期是頭七天。如果你在前七天建立了穩定的例程，繼續下去的可能性大幅提升。</p>
  <p class="guide-p">這個啟動計畫被設計為每天最多 20 分鐘，使用你已有的基本材料（紙和彩色鉛筆），並且每一天都建立在前一天的基礎上。</p>
  <p class="guide-p" style="font-weight:600;color:var(--title);">7 天的進展：</p>
  <table style="width:100%;border-collapse:collapse;margin:4mm 0;">
    <tr style="background:var(--lav)"><th style="padding:5px 8px;text-align:left;font-size:9pt;color:var(--title);">天</th><th style="padding:5px 8px;text-align:left;font-size:9pt;color:var(--title);">主題</th><th style="padding:5px 8px;text-align:left;font-size:9pt;color:var(--title);">建立什麼</th></tr>
    <tr style="border-bottom:1px solid #f0e8e0;"><td style="padding:5px 8px;font-size:9pt;color:var(--body);">1</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">此刻的我</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">自我覺知</td></tr>
    <tr style="border-bottom:1px solid #f0e8e0;"><td style="padding:5px 8px;font-size:9pt;color:var(--body);">2</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">我的情感</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">情感識別</td></tr>
    <tr style="border-bottom:1px solid #f0e8e0;"><td style="padding:5px 8px;font-size:9pt;color:var(--body);">3</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">我的力量</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">自尊基礎</td></tr>
    <tr style="border-bottom:1px solid #f0e8e0;"><td style="padding:5px 8px;font-size:9pt;color:var(--body);">4</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">我的恐懼</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">面對陰影</td></tr>
    <tr style="border-bottom:1px solid #f0e8e0;"><td style="padding:5px 8px;font-size:9pt;color:var(--body);">5</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">我的連結</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">關係覺知</td></tr>
    <tr style="border-bottom:1px solid #f0e8e0;"><td style="padding:5px 8px;font-size:9pt;color:var(--body);">6</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">我的夢想</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">未來願景</td></tr>
    <tr><td style="padding:5px 8px;font-size:9pt;color:var(--body);">7</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">我的承諾</td><td style="padding:5px 8px;font-size:9pt;color:var(--body);">持續實踐</td></tr>
  </table>
</div>
<div id="days-container"></div>
<script>
var days = [
  {d:1,title:"此刻的我",why:"開始任何旅程之前，你需要知道你在哪裡。第一天是關於誠實地看見自己的起點。",ex:{title:"我的情感地圖",mat:"紙張，彩色鉛筆",steps:["閉眼 1 分鐘。感受你的身體，注意你的情感。","睜眼，不思考，立刻選擇一種顏色代表「今天的我」。","用那種顏色和你想要的任何形狀，表達此刻的你。"]},promise:"今天，我承諾誠實地看見自己，不評判。"},
  {d:2,title:"我的情感",why:"情感是訊息，不是問題。第二天幫助你識別和命名你的情感世界。",ex:{title:"情感調色板",mat:"紙張，多種顏色鉛筆",steps:["在紙上畫 5 個格子。","每個格子代表你最常感受到的一種情感。","為每種情感選一個顏色，填滿格子，並寫上情感的名字。"]},promise:"今天，我承諾給我的情感空間，不壓制它們。"},
  {d:3,title:"我的力量",why:"在探索陰影之前，先認識你的力量。第三天建立你的自尊基礎。",ex:{title:"力量象徵符號",mat:"紙張，彩色鉛筆",steps:["思考你最大的三個力量或優點（也許別人告訴過你的）。","為每個力量創造一個象徵符號或圖標。","把這三個符號組合成一個「你的力量標誌」。"]},promise:"今天，我承諾認可自己的力量，即使感覺困難。"},
  {d:4,title:"我的恐懼",why:"恐懼在黑暗中會變得更大。第四天帶恐懼到光明中。",ex:{title:"恐懼的形狀",mat:"紙張，彩色鉛筆",steps:["思考你目前最大的一個恐懼。","給那個恐懼一個形狀和顏色——讓它變得可見。","問自己：「那個恐懼在保護我什麼？」在旁邊寫下答案。"]},promise:"今天，我承諾好奇地面對我的恐懼，而不是逃避它。"},
  {d:5,title:"我的連結",why:"我們不是孤立存在的。第五天探索你的關係網絡和它如何滋養你。",ex:{title:"我的連結蜘蛛網",mat:"紙張，彩色鉛筆",steps:["在頁面中央畫你自己。","畫出你與不同人的連結線（家人、朋友、同事、自然、精神）。","標出哪些連結讓你充滿能量，哪些讓你疲憊。"]},promise:"今天，我承諾感謝給我能量的連結，並有意識地選擇我花時間的人。"},
  {d:6,title:"我的夢想",why:"夢想不是奢侈品——它們是方向。第六天讓你接觸你最深的渴望。",ex:{title:"我的理想生活",mat:"紙張，彩色鉛筆",steps:["想像：如果沒有任何限制，你想要的生活是什麼樣子？","以視覺形式呈現那個生活的一個場景——不是計畫，是感覺。","那個場景中最重要的元素是什麼？"]},promise:"今天，我承諾允許自己夢想，即使現實感覺遠。"},
  {d:7,title:"我的承諾",why:"第一週結束了。第七天是關於整合你學到的，並做出繼續的承諾。",ex:{title:"我對自己的承諾書",mat:"紙張，彩色鉛筆",steps:["回顧前六天的練習。選擇一個最有共鳴的洞察。","以視覺形式，創作你「對自己的承諾書」——你想繼續帶著的一個意圖。","給它加上顏色、形狀和力量，讓它成為一個你想保留的東西。"]},promise:"今天，我承諾繼續這個旅程，每一步，每一天。"}
];
var C = document.getElementById('days-container');
days.forEach(function(day) {
  var pg = document.createElement('div');
  pg.className = 'page day-page';
  var stepsHtml = day.ex.steps.map(function(s,i) {
    return '<div class="day-step"><div class="day-step-n">'+(i+1)+'</div><p>'+s+'</p></div>';
  }).join('');
  pg.innerHTML = '<div class="day-banner"><div class="day-circle">'+day.d+'</div><div class="day-banner-text"><h2>第 '+day.d+' 天 — '+day.title+'</h2><p>啟動計畫 · 7 天 · 第 '+day.d+' 天</p></div></div>'
    + '<div class="day-why">📌 <strong>今天的原因：</strong>'+day.why+'</div>'
    + '<div class="day-exercise"><h3>🎨 '+day.ex.title+'</h3>'
    + '<div class="day-materials"><span>需要：</span>'+day.ex.mat+'</div>'
    + '<div class="day-steps">'+stepsHtml+'</div></div>'
    + '<div class="day-space"></div>'
    + '<div class="day-promise">🌱 <strong>今日承諾：</strong>'+day.promise+'</div>';
  C.appendChild(pg);
});
</script>
</body>
</html>
