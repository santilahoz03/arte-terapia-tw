<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>你的訪問權限 — 家庭藝術治療</title>
<style>
  html, body { margin:0; background:#FAF7F2; color:#2B2522; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .badge { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:#EFE6DA; padding:6px 12px; border-radius:99px; }
  h1 { font-size:28px; line-height:1.3; margin:18px 0 10px; }
  p { font-size:17px; line-height:1.55; color:#5B514B; }
  .card { background:#fff; border:1px solid #EAE0D5; border-radius:16px; padding:24px 20px; margin-top:28px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#1F9D55; margin-right:8px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">購買已確認</span>
    <h1>家庭藝術治療 — 65個活動給兒童、青少年和伴侶</h1>
    <p>謝謝你！我們正在準備你的所有資料。這個頁面很快就會更新，包含你的文件。</p>
    <div class="card">
      <p><span class="dot"></span><strong>請保存這個連結</strong></p>
      <p>這是你終身訪問的連結。請在幾小時內回來，你將找到你購買的產品。</p>
    </div>
  </div>
</body>
</html>
