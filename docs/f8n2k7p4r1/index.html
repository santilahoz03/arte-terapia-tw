<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>贈品 1 — 17 個額外藝術治療技術</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page { size: 210mm 297mm; margin: 0; }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
:root { --lav:#D9C9F7;--lavd:#B89FE0;--pink:#F3B8D2;--title:#4E4036;--body:#6F6258;--body2:#8A7A70;--ft:'Noto Serif TC',serif;--fb:'Noto Sans TC',sans-serif; }
body { font-family:var(--fb); color:var(--body); background:#FFF8F4; }
.page { width:210mm; min-height:297mm; position:relative; page-break-after:always; overflow:hidden; display:flex; flex-direction:column; }
.cover { background:linear-gradient(160deg,#D9C9F7 0%,#F3B8D2 50%,#FFF8F4 100%); align-items:center; justify-content:center; text-align:center; padding:40mm 20mm; }
.cover-badge { font-size:9pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--lavd); background:rgba(255,255,255,.65); padding:5px 18px; border-radius:20px; display:inline-block; margin-bottom:20px; }
.cover h1 { font-family:var(--ft); font-size:28pt; color:var(--title); line-height:1.3; margin-bottom:12px; }
.cover p { font-size:11pt; color:var(--body); margin-bottom:24px; line-height:1.5; }
.cover-pill { display:inline-block; background:var(--title); color:#fff; padding:7px 20px; border-radius:24px; font-size:9pt; font-weight:600; margin:3px; }
.ex-page { background:#fff; padding:14mm 18mm; }
.ex-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6mm; padding-bottom:4mm; border-bottom:2px solid var(--lav); }
.ex-topic { font-size:8pt; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--lavd); }
.ex-num { font-size:8pt; color:var(--body2); }
.ex-title { font-family:var(--ft); font-size:17pt; color:var(--title); margin-bottom:4mm; line-height:1.3; }
.ex-mat { background:#f9f4ff; border-radius:8px; padding:6px 10px; margin-bottom:5mm; font-size:9pt; color:var(--body2); }
.ex-mat strong { color:var(--lavd); }
.ex-steps { display:flex; flex-direction:column; gap:3mm; margin-bottom:5mm; }
.ex-step { display:flex; gap:10px; align-items:flex-start; }
.ex-step-n { width:20px; height:20px; background:linear-gradient(135deg,var(--lav),var(--pink)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8pt; font-weight:700; color:var(--title); flex-shrink:0; margin-top:1px; }
.ex-step p { font-size:10pt; color:var(--body); line-height:1.55; }
.ex-space { flex:1; border:1.5px dashed #d9c9f7; border-radius:8px; margin:3mm 0; min-height:60mm; }
.ex-refl { background:linear-gradient(135deg,#fef3f8,#f0ebff); border-radius:8px; padding:8px 12px; }
.ex-refl-label { font-size:8pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--lavd); margin-bottom:3px; }
.ex-refl p { font-size:10pt; color:var(--title); font-style:italic; line-height:1.5; }
@media print { .no-print { display:none!important; } }
@media screen { body { background:#e0d8d0; padding:20px; } .page { margin:0 auto 20px; box-shadow:0 4px 20px rgba(0,0,0,.2); } .print-btn { position:fixed; bottom:24px; right:24px; background:var(--lavd); color:#fff; border:none; border-radius:50px; padding:14px 28px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(184,159,224,.5); z-index:1000; } }
</style>
</head>
<body>
<button class="print-btn no-print" onclick="window.print()">🖨️ 列印 / 儲存 PDF</button>
<div class="page cover">
  <div class="cover-badge">🎁 贈品 1 · 藝術治療手冊</div>
  <h1>17 個額外<br>藝術治療技術</h1>
  <p>用創意練習更有意識地感受和表達情感的獨特技術</p>
  <div>
    <span class="cover-pill">🎨 17 個練習</span>
    <span class="cover-pill">📖 可列印 PDF</span>
    <span class="cover-pill">✍️ 無需藝術基礎</span>
  </div>
</div>
<div id="container"></div>
<script>
var exs = [
  {title:"色彩對話",mat:"紙張，彩色鉛筆",steps:["選擇兩種代表兩種不同情感的顏色。","讓這兩種顏色「對話」——交替繪畫。","觀察出現的對話。"],refl:"這兩種情感互相說了什麼？"},
  {title:"閉眼繪畫",mat:"紙張，鉛筆",steps:["閉上眼睛。","只憑感覺繪畫——3 分鐘。","睜開眼睛，看看產生了什麼。"],refl:"眼睛閉著時，你注意到了什麼？"},
  {title:"與自然連結",mat:"紙張，綠色鉛筆",steps:["想想一個自然元素（樹、海洋、山脈）。","畫出那個元素。","寫下那個元素給你帶來什麼。"],refl:"如果你現在身處那個地方，你會感覺如何？"},
  {title:"心靈圖像",mat:"紙張，彩色鉛筆",steps:["閉眼，深呼吸 3 次。","讓心靈中浮現一幅圖像。","把那幅圖像畫下來。"],refl:"那個心靈圖像在說什麼？"},
  {title:"隨音樂繪畫",mat:"紙張，鉛筆，音樂",steps:["播放一首舒緩的音樂。","畫出音樂在你身體中的感覺。","使用動作，不必在意形狀。"],refl:"音樂的哪個部分最影響你的線條？"},
  {title:"紋理拼貼",mat:"各種材料（紙張、布料等）",steps:["收集 3-5 種不同紋理的材料。","用顏色在每種材料上留下印記。","製作紋理拼貼畫。"],refl:"哪種紋理最能代表你現在的感受？"},
  {title:"鏡子繪畫",mat:"舊鏡子，彩色筆",steps:["在鏡子上畫出代表積極事物的形狀。","寫下一個每天早晨提醒你的詞語。"],refl:"你每天想提醒自己什麼？"},
  {title:"節奏線條",mat:"紙張，鉛筆",steps:["設置 3 分鐘計時器。","有節奏地繪畫——一個重複動作。","讓節奏平靜你的心靈。"],refl:"什麼節奏自然地從你手的動作中浮現？"},
  {title:"童年繪畫",mat:"紙張，彩色鉛筆",steps:["想想童年最大的快樂。","像孩子時那樣畫出那份快樂。","讓孩子完全快樂。"],refl:"那份快樂現在還給你帶來什麼？"},
  {title:"呼吸藝術",mat:"紙張，藍/綠色鉛筆",steps:["吸氣時，慢慢畫一條延伸的線。","呼氣時，讓線條放鬆或彎曲。","重複 5 次。"],refl:"你注意到吸氣和呼氣線條有什麼不同？"},
  {title:"夢想拼貼",mat:"雜誌，剪刀，膠水，紙張",steps:["剪下吸引你的圖片——不加思考。","把它們粘貼到紙上。","給拼貼取個標題。"],refl:"這幅拼貼告訴你什麼關於你夢想的事？"},
  {title:"創造力量",mat:"紙張，硬質鉛筆",steps:["想想你最大的力量來源。","畫出那種力量——強壯、清晰、有力。","使用粗線條和強烈壓力。"],refl:"你在身體的哪個部分感受到那種力量？"},
  {title:"以形狀呈現好詞",mat:"紙張，彩色鉛筆",steps:["想想一個今天激勵你的詞語。","以形狀而非文字畫出那個詞語。","使用鮮豔的顏色填充。"],refl:"這個形狀與你通常使用的詞語有什麼不同？"},
  {title:"雨後花朵",mat:"紙張，綠色和彩色鉛筆",steps:["先畫雨水。","現在畫雨後生長的花朵。","每朵花 = 困難之後帶來的一件好事。"],refl:"在你生命的「雨水」之後，哪些花朵生長了？"},
  {title:"探索之頁",mat:"紙張，任意顏色",steps:["給自己 10 分鐘自由繪畫——沒有目標。","讓手自由移動。","之後：看看產生了什麼。"],refl:"在自由繪畫中，你發現了什麼？"},
  {title:"積極暗示",mat:"紙張，金/黃色鉛筆",steps:["對自己寫下一個積極肯定（例如：「我已足夠」）。","把那句話或句子畫成美麗的形狀。","把它掛在你的房間裡。"],refl:"相信這個肯定容易嗎？它需要什麼才能更堅定？"},
  {title:"結束與開始",mat:"紙張，兩種不同顏色",steps:["用一種顏色：畫出已結束的事物。","用另一種顏色：畫出剛開始的新事物。","找到這兩者之間的連接點。"],refl:"在結束和開始的時刻，你的身體感覺如何？"}
];
var c = document.getElementById('container');
exs.forEach(function(ex, i) {
  var pg = document.createElement('div');
  pg.className = 'page ex-page';
  var stepsHtml = ex.steps.map(function(s, si) {
    return '<div class="ex-step"><div class="ex-step-n">'+(si+1)+'</div><p>'+s+'</p></div>';
  }).join('');
  pg.innerHTML =
    '<div class="ex-header"><span class="ex-topic">🎨 額外技術</span><span class="ex-num">練習 '+(i+1)+' / 17</span></div>' +
    '<div class="ex-title">'+ex.title+'</div>' +
    '<div class="ex-mat"><strong>需要：</strong> '+ex.mat+'</div>' +
    '<div class="ex-steps">'+stepsHtml+'</div>' +
    '<div class="ex-space"></div>' +
    '<div class="ex-refl"><div class="ex-refl-label">💭 反思</div><p>'+ex.refl+'</p></div>';
  c.appendChild(pg);
});
</script>
</body>
</html>
